[versions]
# ledger-service: Spring AI 2.0.x is built on Boot 4.1.
spring-boot = "4.1.1"
spring-ai = "2.0.1"
# gateway: latest GA Spring Cloud (2025.1.x) supports Boot 4.0.x only.
# Move to Boot 4.1 together with Spring Cloud 2026.0 once it is GA.
spring-boot-gateway = "4.0.8"
spring-cloud = "2025.1.3"
spring-dependency-management = "1.1.7"

[libraries]
spring-cloud-bom = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }
spring-ai-bom = { module = "org.springframework.ai:spring-ai-bom", version.ref = "spring-ai" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-boot-gateway = { id = "org.springframework.boot", version.ref = "spring-boot-gateway" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
