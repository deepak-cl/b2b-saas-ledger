server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: ledger-service
  threads:
    virtual:
      enabled: true
  # Control-plane connection. Tenant connections come from public.tenant_datasources.
  datasource:
    url: ${LEDGER_DB_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${LEDGER_DB_USER:ledger}
    password: ${LEDGER_DB_PASSWORD:ledger}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      # No tenant is bound at startup, so Hibernate must not probe the routing DataSource.
      jakarta.persistence.database-product-name: PostgreSQL
      jakarta.persistence.database-major-version: 17
  flyway:
    # Control plane only; tenant schemas are migrated per tenant (TenantMigrator).
    locations: classpath:db/migration/control
    schemas: public,ai
    placeholders:
      shared_jdbc_url: ${spring.datasource.url}
      shared_db_username: ${spring.datasource.username}
      shared_db_secret_ref: env:LEDGER_DB_PASSWORD
      embedding_dimensions: ${ledger.tenancy.embedding-dimensions}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${LEDGER_OIDC_ISSUER:http://localhost:8180/realms/ledger}
          jwk-set-uri: ${LEDGER_OIDC_JWKS:http://localhost:8180/realms/ledger/protocol/openid-connect/certs}
          audiences: ledger-api
  batch:
    job:
      enabled: false # jobs are launched by the ingestion API, not at startup
    jdbc:
      initialize-schema: never # control-plane Flyway V2 owns BATCH_* tables
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB
  ai:
    # none keeps the stub model. Profiles openai / anthropic / ollama switch these.
    model:
      chat: ${LEDGER_AI_CHAT:none}
      embedding: ${LEDGER_AI_EMBEDDING:none}
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration

ledger:
  tenancy:
    # Must match the active embedding model (OpenAI text-embedding-3-small = 1536).
    # Changing it requires re-embedding and a new migration.
    embedding-dimensions: ${LEDGER_EMBEDDING_DIMENSIONS:1536}
    max-concurrent-postings-per-tenant: 8
  # Local-development fallbacks for env: secret references (never used when the env var is set).
  secrets:
    LEDGER_DB_PASSWORD: ledger
  ingestion:
    sec:
      base-url: ${SEC_EDGAR_BASE_URL:https://data.sec.gov}
      # Required before any SEC call. Example: Ledger Local dev@example.com
      user-agent: ${SEC_USER_AGENT:}
      rate-limit-per-second: 10
      max-years: 5
    paysim:
      import-directory: ${LEDGER_IMPORT_DIR:var/imports}
      chunk-size: 200
      partitions: 4
    reconciliation:
      enabled: true
      cron: "0 15 2 * * *"
  ai:
    monthly-token-budget: ${LEDGER_AI_MONTHLY_TOKENS:200000}
    max-output-tokens: 800
    requests-per-minute: 60
    cache-ttl: 10m
    statement-timeout: 3s
    sql-row-limit: 50
    provider: ${LEDGER_AI_PROVIDER:stub}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    db:
      # The routing DataSource has no tenant at probe time; the control-plane pool is checked instead.
      ignore-routing-data-sources: true

logging:
  pattern:
    level: "%5p [tenant=%X{tenant:-}] [req=%X{requestId:-}]"
